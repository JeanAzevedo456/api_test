<!DOCTYPE html> <!-- Declara que este documento segue o padrão HTML5 -->
<html lang="pt-BR"> <!-- Define o idioma principal do documento -->

<head> <!-- Cabeçalho do documento contendo metadados e links externos -->
    <meta charset="UTF-8"> <!-- Define a codificação UTF-8 para suporte a acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Suporte a telas responsivas em dispositivos móveis -->
    <title>Tarefas</title> <!-- Título que aparece na aba do navegador -->
    
    <!-- Link de importação da folha de estilos (CSS) do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body> <!-- Corpo da página onde fica o conteúdo visível para o usuário -->
    
    <!-- Container do Spinner de carregamento -->
    <div class="d-flex justify-content-center my-4">
        <!-- Elemento visual do carregamento (corrigido: spinner-border) -->
        <div class="spinner-border" role="status" id="loading">
            <!-- Texto oculto para leitores de tela (corrigido: visually-hidden) -->
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <!-- Título principal da seção centralizado -->
    <h1 class="text-center my-3">Tarefas de um usuário</h1>

    <!-- Estrutura da tabela HTML para exibição das tarefas via JS -->
    <div class="container">
        <table class="table table-hover" id="tasks">
            <!-- Os dados da tabela serão inseridos dinamicamente pelo script.js -->
        </table>
    </div>

    <!-- Script para componentes interativos do Bootstrap (URL corrigida: bootstrap) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Lógica JavaScript para integração com a API -->
    <script src="script.js"></script>
</body>

</html> <!-- Fechamento correto da tag raiz do HTML -->
